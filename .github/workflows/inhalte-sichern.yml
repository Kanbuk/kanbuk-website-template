# =============================================================================
#  Nächtliche Sicherung der gepflegten Inhalte
# =============================================================================
#
#  WOZU: Sobald ein Betrieb seine Inhalte selbst pflegt, liegt der aktuelle
#  Stand beim Redaktionsdienst – nicht im Projekt. Ohne diesen Ablauf driftet
#  beides ab dem ersten Tag auseinander, an dem der Betrieb etwas ändert.
#  Wird der Dienst ein halbes Jahr später gekündigt oder fällt aus, baut die
#  Website mit uraltem Bestand: verkaufte Dinge stünden wieder als verfügbar
#  da, alte Preise wären wieder gültig. Das ist schlimmer als ein sichtbarer
#  Ausfall, weil es plausibel aussieht.
#
#  Genau diese Zusage steht in redaktion/README.md: „Auch wenn der Dienst
#  eines Tages weg ist, bleibt die Website stehen." Sie stimmt nur, solange
#  dieser Ablauf läuft. Deshalb liefert der Motor ihn mit, statt ihn jedem
#  Projekt einzeln zu überlassen.
#
#  WAS ER TUT: Inhalte, Bilder UND hochgeladene Dateien holen, und nur dann
#  einchecken, wenn sich wirklich etwas geändert hat. Der Einchecke-Vorgang
#  stößt bei Vercel eine neue Veröffentlichung an – der Betrieb muss nichts
#  tun.
#
#  EINRICHTEN (einmalig, im Repo unter Settings):
#    1. Actions → General → Workflow permissions → „Read and write"
#    2. Secrets and variables → Actions → Secret `REDAKTION_TOKEN`
#       (nur nötig, wenn der Datensatz privat ist)
#    3. >>> DIE ADRESSE WEITER UNTEN EINTRAGEN <<< – ohne sie bricht der
#       Ablauf mit einer Meldung ab. Warum, steht dort.
#    4. Im Redaktionsdienst einen Webhook auf GitHub legen, damit
#       „Veröffentlichen" sofort wirkt statt erst in der Nacht – Anleitung
#       in redaktion/README.md.
#
#  OHNE REDAKTIONSSYSTEM passiert hier nichts: Der erste Schritt sieht, dass
#  redaktion/dienst.json fehlt, und bricht den Lauf freundlich ab.
# =============================================================================
name: Inhalte sichern

on:
  schedule:
    # 03:12 UTC – bewusst eine krumme Minute: Zur vollen Stunde stehen bei
    # GitHub Zehntausende Abläufe an, und der eigene startet dann mit
    # Verspätung oder gar nicht.
    - cron: '12 3 * * *'
  # Von Hand auslösbar – der Knopf steht im Reiter „Actions".
  workflow_dispatch:
  # Vom Redaktionsdienst auslösbar: „Veröffentlichen" wirkt dann sofort.
  repository_dispatch:
    types: [inhalte]

# Schreibrecht für den Einchecke-Vorgang. Mehr braucht dieser Ablauf nicht.
permissions:
  contents: write

# Zwei Läufe gleichzeitig würden sich beim Einchecken gegenseitig überholen.
concurrency:
  group: inhalte-sichern
  cancel-in-progress: false

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      # Fremde Bausteine bewusst auf dem aktuellen Hauptstand: Ein Klon bekommt
      # keine Updates. Was hier schon beim Anlegen als veraltet gemeldet wird,
      # ist in zwei Jahren abgeschaltet – und dann steht die Sicherung still,
      # ohne dass jemand danach sucht. (Der erste echte Lauf am 29.07.2026
      # meldete genau das für v4.)
      - uses: actions/checkout@v7

      - name: Hat dieses Projekt überhaupt ein Redaktionssystem?
        id: pruefung
        run: |
          if [ -f redaktion/dienst.json ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
          else
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "Kein Redaktionssystem eingerichtet – nichts zu sichern." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.pruefung.outputs.vorhanden == 'ja'
        with:
          node-version: '22'

      # Kein `npm ci`: Das Holskript benutzt ausschließlich Bordmittel von
      # Node. Damit kann die Sicherung nicht daran scheitern, dass ein Paket
      # nicht mehr installierbar ist – und sie läuft in Sekunden.
      - name: Inhalte und Bilder holen
        if: steps.pruefung.outputs.vorhanden == 'ja'
        env:
          REDAKTION_TOKEN: ${{ secrets.REDAKTION_TOKEN }}
        # `set -o pipefail` IST DIE GANZE ZUSAGE.
        # Ohne diese Zeile ist der Rückgabewert einer Rohrleitung der des
        # LETZTEN Befehls – also der von `tee`, und der gelingt immer.
        # Scheitert der Abruf (Token abgelaufen, Datensatz nachträglich auf
        # privat gestellt, Dienst nicht erreichbar), läuft der Schritt trotzdem
        # grün durch, es gibt nichts einzuchecken, und der Ablauf meldet Erfolg.
        # Die Sicherung sichert dann monatelang nichts, ohne dass es jemand
        # erfährt – und genau auf ihr beruht die Zusage an den Kunden, dass ein
        # gekündigtes Redaktionskonto der Website nichts wegnimmt.
        run: |
          set -o pipefail
          node scripts/inhalte.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Nur bei Änderung einchecken
        if: steps.pruefung.outputs.vorhanden == 'ja'
        # ===================================================================
        #  HIER STEHT DIE ADRESSE DES BETREUERS. Beim Klonen eintragen.
        #  Die Begründung steht weiter unten im Kasten „Der Autor entscheidet".
        # ===================================================================
        env:
          SICHERUNG_MAIL: 'PLATZHALTER-BETREUER@muster-betrieb.example'
        run: |
          # -----------------------------------------------------------------
          #  DER AUTOR ENTSCHEIDET, OB DIE WEBSITE ÜBERHAUPT NOCH BAUT
          #
          #  An einem Kundenprojekt gemessen (12.–17.08.2026): Vercel liefert
          #  bei einem PRIVATEN Repo nur Commits aus, deren AUTOR ein
          #  Team-Mitglied ist. `github-actions[bot]` ist keines. Solche
          #  Commits landen stumm im Zustand BLOCKED – keine Mail, kein roter
          #  Haken, nur ein Eintrag in einer Oberfläche, die niemand ansieht.
          #  Über zwanzig Deploys hinweg ausnahmslos:
          #
          #      Autor = Bot     ->  BLOCKED
          #      Autor = Mensch  ->  READY
          #
          #  Vercel nennt es `seatBlock` mit `blockCode:
          #  COMMIT_AUTHOR_REQUIRED` (in der Vercel-API-Referenz nachgesehen
          #  am 31.08.2026, nicht aus dem Gedächtnis). Es hängt am AUTOR –
          #  nicht am Zweig, nicht am Auslöser. Ein Deploy-Hook hilft deshalb
          #  nicht: Er veröffentlicht denselben blockierten Commit.
          #
          #  Und es traf nicht nur die Sicherung: Der Auslöser des
          #  Redaktionssystems deployt IMMER den letzten Commit. War der vom
          #  Bot – und das war er nach jeder Nacht mit Änderungen –, wurde
          #  JEDE Veröffentlichung des Betriebs blockiert. Fünf Tage lang hat
          #  ein Händler Fotos hochgeladen, die nie online gingen.
          #
          #  DER ERSTE AUSWEG WAR FALSCH. Bis 31.08.2026 schrieb dieser Ablauf
          #  auf einen eigenen Zweig `inhalte-sicherung`, den Vercel nie baute.
          #  Damit konnte er nichts mehr blockieren – aber auch nichts mehr
          #  veröffentlichen. Der Betrieb drückt „Veröffentlichen", der Lauf
          #  ist grün, der Commit entsteht, und die Website ändert sich NIE.
          #  Das Symptom war weg und der Zweck gleich mit; die Anleitung
          #  versprach derweil unverändert „wirkt sofort". Genau der
          #  Fehlertyp, gegen den dieser ganze Baustein antritt.
          #
          #  DESHALB: auf `main`, mit der Adresse des Betreuers – also
          #  desjenigen, der ohnehin jeden anderen Commit dieses Repos macht
          #  und bei Vercel als Mitglied bekannt ist. Der NAME sagt trotzdem
          #  klar, dass die Automatik geschrieben hat; im Verlauf soll niemand
          #  glauben, hier hätte ein Mensch getippt.
          #
          #  WARUM DER PLATZHALTER LAUT ABBRICHT statt einfach zu committen:
          #  Eine fremde oder erfundene Adresse bringt das Blockieren zurück,
          #  und zwar STUMM – der Betrieb pflegt weiter, die Website steht
          #  still, und niemand sucht danach. Ein abgebrochener Lauf dagegen
          #  ist rot und der Hoster schickt eine Mail. Lieber gar keine
          #  Sicherung als eine, die die Veröffentlichung anhält.
          # -----------------------------------------------------------------
          case "$SICHERUNG_MAIL" in
            *muster-betrieb.example|*PLATZHALTER*|'')
              echo "::error::In .github/workflows/inhalte-sichern.yml steht noch der Platzhalter statt der E-Mail-Adresse des Betreuers. Ohne sie blockiert Vercel jeden Commit dieses Ablaufs - und damit auch jede Veroeffentlichung des Betriebs. Eintragen unter SICHERUNG_MAIL."
              exit 1
              ;;
          esac

          git config user.name  "Inhalte-Sicherung (automatisch)"
          git config user.email "$SICHERUNG_MAIL"

          # DREI Pfade, jeder für sich. Stehen sie in EINEM `git add` und
          # einer fehlt noch (ein Betrieb, der bisher nur Texte gepflegt hat,
          # hat keinen Bildordner), bricht der ganze Aufruf ab – und die
          # Änderung wird still nicht gesichert. Nachgestellt und gemessen.
          #
          # `public/inhalte` FEHLTE HIER BIS ZUM 31.08.2026 – der zweite Bruch
          # derselben Kette. Dort landen die hochgeladenen DATEIEN: bei einem
          # Gastro-Betrieb der Menüplan als PDF, also genau das, wofür das
          # Redaktionssystem eingerichtet wurde. Gesichert wurde bisher nur
          # der VERWEIS darauf in daten/inhalte.json. Wirkung: Die Website
          # zeigt auf /inhalte/<datei>.pdf, während die Datei nirgends liegt –
          # ein toter Link ANSTELLE eines funktionierenden. Das ist schlimmer
          # als „tut nichts", weil es aussieht wie eine Änderung.
          git add -A -- daten/inhalte.json 2>/dev/null || true
          git add -A -- fotos/inhalte 2>/dev/null || true
          git add -A -- public/inhalte 2>/dev/null || true

          # SCHUTZ VOR GENAU DIESEM TOTEN LINK: Jede Datei, auf die
          # daten/inhalte.json zeigt, muss auch wirklich dort liegen. Lieber
          # laut abbrechen und gar nicht veröffentlichen als einen Verweis ins
          # Leere ausliefern.
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            if (!existsSync("daten/inhalte.json")) process.exit(0);
            const roh = readFileSync("daten/inhalte.json", "utf8");
            const fehlend = [...roh.matchAll(/"(inhalte\/[^"]+)"/g)]
              .map(function (t) { return t[1]; })
              .filter(function (pfad) { return !existsSync("public/" + pfad); });
            if (fehlend.length) {
              console.error("ABBRUCH - verwiesene Datei fehlt: " + fehlend.join(", "));
              process.exit(1);
            }
          '

          if git diff --cached --quiet; then
            echo "Nichts geändert – kein Einchecken, keine Veröffentlichung." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Inhalte vom Betrieb übernommen (automatisch)"
            # Kein --force. Kommt der Push nicht durch, weil jemand
            # gleichzeitig gearbeitet hat, soll der Lauf scheitern statt
            # fremde Arbeit zu überschreiben.
            git push origin HEAD:main
            echo "Neuer Stand auf main – Vercel veröffentlicht ihn." >> "$GITHUB_STEP_SUMMARY"
          fi
